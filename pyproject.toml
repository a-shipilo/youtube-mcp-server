[project]
name = "youtube-mcp-server"
dynamic = ["version"]
description = "MCP server for your own YouTube channel: read and answer comments, moderate them and look at channel analytics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "a-shipilo" }]
requires-python = ">=3.10"
keywords = ["mcp", "youtube", "youtube-api", "youtube-analytics", "comments", "claude", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "google-auth-oauthlib>=1.2",
    "httpx>=0.27",
    "mcp>=1.25,<2",
    "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/a-shipilo/youtube-mcp-server"
Issues = "https://github.com/a-shipilo/youtube-mcp-server/issues"

[project.scripts]
youtube-mcp-server = "youtube_mcp_server.server:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/youtube_mcp_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_mcp_server"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
